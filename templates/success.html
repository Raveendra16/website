{% extends "base.html" %}

{% block title %}Thank You - Bring Back Edtech{% endblock %}

{% block content %}
<section class="success-hero section-padding">
    <div class="container text-center">
        <div class="success-icon mx-auto mb-4">
            <i class="fas fa-check-circle"></i>
        </div>
        <h1 class="display-5 fw-bold mb-3">Thank You!</h1>
        <p class="lead text-muted mb-5">Your request has been received successfully. We'll get back to you within 24 hours.</p>
        <div class="success-actions d-flex flex-wrap gap-3 justify-content-center">
            <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg px-4">
                <i class="fas fa-home me-2"></i> Back to Home
            </a>
            <a href="{{ url_for('courses_page') }}" class="btn btn-outline-primary btn-lg px-4">
                <i class="fas fa-book-open me-2"></i> Browse Courses
            </a>
        </div>
    </div>
</section>

<style>
    .success-icon {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: var(--gradient-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 3rem;
        box-shadow: var(--shadow);
    }
</style>
{% endblock %}
